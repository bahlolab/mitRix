name             = d_loop_7s
version          = 0.3.0
description      = 7S DNA / replication proxy (DLOOP/ND1) and flap/7S, flap/primer ratios on circularised chrM
entry            = run.sh
requires_inputs  = bam
requires_core    = ref_context mt_coverage mt_circular
tools            = samtools>=1.10 mosdepth>=0.3 bwa
options          = --region-7s --region-flap --region-primer
cohort           = 7S:DLOOP_ND1_ratio_mean flap_7S:flap_7S_ratio flap_primer:flap_primer_ratio
