name             = pathogenic
version          = 0.1.0
description      = Known pathogenic mtDNA variants (MITOMAP Cfrm + ClinVar P/LP) and user lists
entry            = run.sh
language         = R
requires_core    = mt_coverage mt_variants
requires_inputs  = mt_variants
tools            = Rscript bcftools
options          = --list --pathogenic --hf-min --min-alt-reads --exclude-filters
cohort           = pathogenic_n:pathogenic_count pathogenic:pathogenic_variants pathogenic_max_hf:pathogenic_max_hf
