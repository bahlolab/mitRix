name             = heteroplasmy
version          = 0.3.0
description      = Heteroplasmy burden, strand-resolved spectrum and MLC score sum (MSS)
entry            = run.sh
language         = R
requires_core    = ref_context mt_coverage mt_variants
requires_inputs  = mt_variants
tools            = Rscript
options          = --hf-min --hf-max --hf-split --min-alt-reads --exclude-filters --blocklist --numt --numt-k --numt-max-hf
cohort           = heteroplasmy:heteroplasmy_count heteroplasmy_low:heteroplasmy_low_count age_accumulating:age_accumulating_count MSS:MSS
