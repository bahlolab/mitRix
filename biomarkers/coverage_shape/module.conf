name             = coverage_shape
version          = 0.1.0
description      = chrM coverage-shape model: GC bias, replication gradient from O_L, common-deletion step; GC-adjusted ND4/ND1 and MAJOR/MINOR
entry            = run.sh
requires_inputs  = bam
requires_core    = ref_context mt_coverage mt_circular
tools            = Rscript
options          = --bin --exclude --ol --deletion-span
cohort           = gc_slope:gc_slope replication_gradient:replication_gradient deletion_step:deletion_step ND4_ND1_gc_adj:ND4_ND1_ratio_gc_adj MAJOR_MINOR_gc_adj:MAJOR_MINOR_ratio_gc_adj local_dip:local_dip
